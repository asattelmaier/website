name: Build and Push

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

env:
  GHC_VERSION: '9.14.1'
  CABAL_VERSION: '3.18.2.0'

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('**/*.cabal', 'cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-

      - name: Install dependencies
        run: |
          cabal update
          cabal build --only-dependencies --enable-benchmarks
      - name: Build
        run: cabal build --enable-benchmarks all
      - name: Archive build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist-newstyle

  test:

    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: dist-newstyle

      - name: Run Tests
        run: |-
          ./test/tests.sh

  pushToDockerHub:

    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: dist-newstyle

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          IMAGE_NAME: website
        with:
          context: .
          push: true
          file: docker/Dockerfile
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  pushToGoogleCloud:

    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: dist-newstyle

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCLOUD_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCLOUD_PROJECT_ID }}

      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker --quiet

      - uses: docker/build-push-action@v7
        env:
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
          IMAGE_NAME: website
        with:
          context: .
          push: true
          file: docker/Dockerfile
          tags: |
            eu.gcr.io/${{ secrets.GCLOUD_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            eu.gcr.io/${{ secrets.GCLOUD_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

  deployToGoogleCloud:

    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: pushToGoogleCloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCLOUD_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCLOUD_PROJECT_ID }}

      - name: Deploy Revision
        env:
          SERVICE_NAME: website
          IMAGE_NAME: website
          REGION: europe-west1
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image eu.gcr.io/${{ secrets.GCLOUD_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --project=${{ secrets.GCLOUD_PROJECT_ID }} \
          --region=${{ env.REGION }}
